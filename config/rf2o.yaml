# rf2o_laser_odometry parameters.
#
# IMPORTANT: publish_tf is FALSE.
#   The robot_localization EKF owns odom -> base_link (REP-105). If rf2o also
#   broadcast that transform, the TF tree would have two parents for base_link and
#   everything downstream would be ambiguous. rf2o still publishes its estimate on
#   /odom_rf2o so the EKF can fuse it.
#
# rf2o looks up base_link -> laser, so that static transform must exist before it
# starts. firefighter_bringup publishes it.
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    publish_tf: false
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    freq: 20.0
