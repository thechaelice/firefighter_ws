[project]
name = "firefighter-ws"
version = "0.1.0"
description = "Autonomous firefighter robot with wireless ESP-NOW beacon sensing, LiDAR SLAM navigation, and thermal flame localization"
readme = "README.md"
authors = [
    { name = "thechaelice", email = "thechalice22@gmail.com" },
    { name = "al-chris", email = "christopheraliu07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adafruit-blinka>=9.2.0",
    # Thermal camera is a Melexis MLX90641 (16x12), NOT an MLX90640. There is no
    # MLX90641 driver on PyPI; it is driven via the vendor C library
    # (github.com/melexis/mlx90641-library). See docs/thermal-camera.md.
    "lgpio>=0.2.2.0 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyserial>=3.5 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "rpi-gpio>=0.7.1",
    "scipy>=1.18.1",
]

# NOTE: this repository is a ROS 2 (colcon) workspace plus ESP32 firmware, not a
# distributable Python package - there is no importable `firefighter_ws` module.
# There is therefore deliberately no `[build-system]` table here: uv then manages
# this project's dependencies without trying to build/install the project itself.
#
# Adding `[build-system]` with the `uv_build` backend makes `uv add` fail with:
#   Expected a Python module at: src/firefighter_ws/__init__.py
# If a console script is ever wanted, add a real package (e.g.
# src/firefighter_ws/__init__.py with a main()) AND the build-system table, or
# use `[tool.uv] package = false` to opt out of packaging explicitly.

[dependency-groups]
# `uv run --group test pytest`  (pure Python - no ROS needed)
test = [
    "pytest>=7.4",
]
# `uv run --group plot scripts/plot_bag.py`
plot = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
